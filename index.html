<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mixue Ice Cream Catch</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- CSS Game -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
         START SCREEN
    ========================== -->
    <div id="startScreen">
      <div class="start-box">
        <div class="game-logo">🍦</div>

        <h1>Mixue Ice Cream Catch</h1>

        <p>Tangkap es krim sebanyak-banyaknya!</p>

        <div class="instruction">
          <p>🎮 Gunakan tombol</p>

          <div class="keyboard">
            <span>⬅️</span>
            <span>➡️</span>
          </div>

          <small> Gerakkan karakter untuk menangkap es krim. </small>
        </div>

        <button id="startBtn">
          <i class="bi bi-play-fill"></i>
          START GAME
        </button>
      </div>
    </div>

    <!-- =========================
         GAME
    ========================== -->

    <div id="game">
      <!-- HUD -->
      <div id="hud">
        <div class="score-box">
          ⭐ Score:
          <span id="score">0</span>
        </div>

        <div class="lives-box">
          ❤️
          <span id="lives">3</span>
        </div>
      </div>

      <!-- BACKGROUND -->
      <div id="bg1" class="bg"></div>
    

      <!-- ITEM ES KRIM AKAN MUNCUL DI SINI -->
      <div id="items"></div>

      <!-- CHARACTER -->
      <img id="person" src="images/person.png" alt="Player" />

      <!-- GAME OVER -->
      <div id="gameOver">
        <div class="game-over-box">
          <div class="game-over-icon">💀</div>

          <h2>Game Over!</h2>

          <p>
            Score kamu:
            <strong id="finalScore">0</strong>
          </p>

          <button id="restartBtn">
            <i class="bi bi-arrow-clockwise"></i>
            PLAY AGAIN
          </button>
        </div>
      </div>
    </div>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>
  </body>
</html>
